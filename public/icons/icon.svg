<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- The cabinet mark: two paddles, a net, a ball. Drawn on a 16-unit grid
       in the palette from src/core/config.ts, same as everything else. The
       PNGs beside this file are rasterisations of it. -->
  <rect width="16" height="16" fill="#0b0b16"/>
  <g fill="#1f1f38">
    <rect x="7" y="1" width="2" height="2"/>
    <rect x="7" y="4" width="2" height="2"/>
    <rect x="7" y="10" width="2" height="2"/>
    <rect x="7" y="13" width="2" height="2"/>
  </g>
  <rect x="3" y="4" width="2" height="8" fill="#4fd6ff"/>
  <rect x="11" y="4" width="2" height="8" fill="#ff5c7a"/>
  <rect x="7" y="7" width="2" height="2" fill="#ffd23f"/>
</svg>
